$work = 1
$web = 2
$dev = 3
$game = 4
$social = 5


# Virtual machine and work
# ---
# Virt-manager
windowrulev2 = workspace $work,class:virt-manager

# Space
windowrulev2 = workspace $work,class:JetBrains Space

# Thunderbird
windowrulev2 = workspace $work,class:org.mozilla.thunderbird

# Web
# ---
# Firefox
windowrulev2 = workspace $web,class:firefox

# Dev
# ---
# Kitty
windowrulev2 = workspace $dev,class:kitty
# VSCode
windowrulev2 = workspace $dev,class:code-url-handler

# Gaming
# ---
# Bottles
windowrulev2 = workspace $game,class:bottles
# Steam
windowrulev2 = workspace $game,class:steam
# Heroic
windowrulev2 = workspace $game,class:heroic


# Social
# ---
# Telegram
windowrulev2 = float,center,class:(^org.telegram.desktop.*)
windowrulev2 = workspace $social, class:(^org.telegram.desktop.*)

# Other
# ---
# Pavucontrol
windowrulev2 = float,class:(pavucontrol)
windowrulev2 = size 900 500,class:(pavucontrol)
#OBS Studio
windowrulev2 = float,class:com.obsproject.Studio

# Clipboard manager
windowrulev2 = float,class:copyq
windowrulev2 = dimaround,class:copyq

# Screenshot
windowrulev2 = stayfocused,class:slurp
windowrulev2 = fullscreen,class:slurp

# Keepassxc
windowrulev2 = float,class:keepassxc

# Calculator
windowrulev2 = float,class:org.gnome.Calculator

# Picture in picture
windowrulev2 = float,title:Picture-in-Picture
windowrulev2 = pin,title:Picture-in-Picture
windowrulev2 = noinitialfocus,title:Picture-in-Picture
windowrulev2 = size 640 360,title:Picture-in-Picture
windowrulev2 = move 100%-655 100%-375,title:Picture-in-Picture

# OpenRGB
windowrulev2 = float,class:openrgb
windowrulev2 = center,class:openrgb
windowrulev2 = size 1300 700,class:openrgb

# Space
windowrulev2 = float,class:JetBrains Space
windowrulev2 = center,class:JetBrains Space

# System Monitor
windowrulev2 = float,class:org.gnome.SystemMonitor
windowrulev2 = center,class:org.gnome.SystemMonitor
windowrulev2 = size 1200 800,class:org.gnome.SystemMonitor
